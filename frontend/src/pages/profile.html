<section class="max-w-3xl mx-auto mt-20 bg-gradient-to-br from-[#581c87b3] via-[#be185d99] to-[#581c87b3] p-8 sm:p-12 rounded-2xl shadow-2xl text-pink-100 space-y-8">
    <h2 class="text-4xl font-bold text-center text-transparent bg-clip-text bg-gradient-to-r from-[#00ffd5] via-[#ff00c8] to-[#7f00ff] drop-shadow"
        data-i18n="nav.profile">
        Profil
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-start">
        <!--appercu avatar-->
        <div class="flex flex-col items-center gap-4">
            <div class="w-32 h-32 rounded-full border border-pink-500/40 shadow-[0_0_20px_#ff00c8] overflow-hidden bg-black/40">
                <img id="profileAvatarPreview" src="/assets/login.png" alt="Avatar" class="w-full h-full object-cover">
            </div>
            <p class="text-sm text-pink-200/80 text-center" data-i18n="profile.avatar_preview">Apercu de votre image de profil</p>  
        </div>

        <form id="profileForm" class="md:col-span-2 grid gap-4">
            <div class="grid gap-2">
                <label class="text-pink-200/90 text-sm" data-i18n="profile.email_label">Email (lecture seule)</label>
                <input name="email" type="email" disabled class="px-4 py-3 rounded bg-[#1a1a2eb3] border border-pink-500/40 text-pink-100 placeholder-pink-300 focus:outline-none" />
            </div>

            <div class="grid gap-2">
                <label class="text-pink-200/90 text-sm" data-i18n="profile.username_label">Nom d'utilisateur</label>
                <input name="username" type="text" placeholder="" class="px-4 py-3 rounded bg-[#1a1a2eb3] border border-pink-500/40 text-pink-100 placeholder-pink-300 focus:outline-none" />
            </div>

            <div class="grid gap-2">
                <label class="text-pink-200/80 text-sm" data-i18n="profile.alias_label">Alias (public)</label>
                <input name="alias" type="text" placeholder="Ex: neoWave" class="px-4 py-3 rounded bg-[#1a1a2eb3] border border-pink-500/40 text-pink-100 placeholder-pink-300 focus:outline-none" />
            </div>

            <div class="grid gap-2">
                <label class="text-pink-200/90 text-sm" data-i18n="profile.avatar_file_label">Upload avatar</label>
                <input name="avatar" type="file" accept="image/*"
                    class="px-4 py-3 rounded bg-[#1a1a2eb3] border border-pink-500/40 text-pink-100 focus:outline-none" />
            </div>

            <fieldset class="grid gap-3 border border-pink-500/20 rounded-xl p-4 bg-black/20">
                <legend class="px-2 text-sm text-pink-200/80" data-i18n="profile.MdpChange">Changer le mot de passe</legend>

                <div class="grid gap-2">
                <label class="text-pink-200/80 text-sm" data-i18n="profile.actualMDP">Mot de passe actuel</label>
                <input name="old_password" type="password" autocomplete="current-password"
                    class="px-4 py-3 rounded bg-[#1a1a2eb3] border border-pink-500/40 text-pink-100 focus:outline-none" />
                </div>

                <div class="grid gap-2">
                <label class="text-pink-200/80 text-sm" data-i18n="profile.newMDP">Nouveau mot de passe</label>
                <input name="new_password" type="password" autocomplete="new-password"
                    class="px-4 py-3 rounded bg-[#1a1a2eb3] border border-pink-500/40 text-pink-100 focus:outline-none" />
                </div>

                <div class="grid gap-2">
                <label class="text-pink-200/80 text-sm" data-i18n="profile.confirm">Confirmer le nouveau mot de passe</label>
                <input name="new_password_confirm" type="password" autocomplete="new-password"
                    class="px-4 py-3 rounded bg-[#1a1a2eb3] border border-pink-500/40 text-pink-100 focus:outline-none" />
                </div>
            </fieldset>

            <div class="grid gap-2">
                <label class="text-pink-200/90 text-sm" data-i18n="profile.lang_label">Langue par défaut</label>

                <div id="profileLangDropdown" class="relative inline-block text-left">
                    <!-- bouton -->
                    <button
                    id="preferredLangBtn"
                    type="button"
                    class="w-full inline-flex items-center justify-between px-4 py-3 rounded bg-[#1a1a2eb3] border border-pink-500/40 text-pink-100 hover:bg-[#1f1f30] focus:outline-none"
                    aria-haspopup="menu" aria-expanded="false"
                    >
                    <span class="flex items-center gap-2">
                        <span aria-hidden="true">🌐</span>
                        <span id="preferredLangLabel">Français</span>
                    </span>
                    <svg class="h-4 w-4 opacity-70" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z" clip-rule="evenodd"/>
                    </svg>
                    </button>

                    <!-- menu -->
                    <div
                    id="preferredLangMenu"
                    class="hidden absolute right-0 top-full mt-2 w-44 z-50 rounded-xl overflow-hidden
                            bg-black/80 backdrop-blur border border-pink-500/30 shadow-[0_0_20px_#ff00c8]"
                    role="menu" aria-labelledby="preferredLangBtn"
                    >
                    <button class="hover:bg-pink-600 py-2 w-full text-left px-3 transition-all" data-lang="fr">🇫🇷 Français</button>
                    <button class="hover:bg-pink-600 py-2 w-full text-left px-3 transition-all" data-lang="en">🇬🇧 English</button>
                    <button class="hover:bg-pink-600 py-2 w-full text-left px-3 transition-all" data-lang="es">🇪🇸 Español</button>
                    </div>
                </div>

                <!-- champ envoyé au backend au submit -->
                <input id="preferredLangHidden" name="preferred_lang" type="hidden" value="fr" />

                <p class="text-sm text-pink-200/70" data-i18n="profile.lang_helper">
                    Cette langue s’appliquera à l’interface par défaut.
                </p>
            </div>

            <div class="flex items-center gap-3 pt-2">
                <button id="profileSave" type="submit"
                class="rounded-full px-6 py-3 font-semibold shadow-[0_0_15px_theme(colors.pink.500)] transition
                        bg-pink-600 hover:bg-pink-700 hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed"
                disabled
                data-i18n="common.save">
                💾 Enregistrer
                </button>
                <button type="button" id="profileCancel" class="rounded-full px-6 py-3 bg-black/40 border border-pink-500/30 hover:bg-black/60 transition"
                    data-i18n="common.cancel">
                    Annuler
                </button>
                <p id="profileMsg" class="ml-auto text-sm text-pink-200"></p>
            </div>
        </form>
    </div>
</section>
