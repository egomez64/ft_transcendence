<section class="max-w-md mx-auto mt-24 bg-black/30 p-8 rounded-xl border border-pink-500/30 text-pink-100">
  <h2 class="text-3xl font-bold mb-6 text-center" data-i18n="set-password.set"></h2>
  <form id="setPasswordForm" class="space-y-4">
    <input type="password" id="newPassword" data-i18n="profile.newMDP"
           class="w-full px-4 py-3 rounded-md bg-[#1a1a2e] border border-pink-400/40" required />
    <input type="password" id="confirmPassword" data-i18n="profile.confirm"
           class="w-full px-4 py-3 rounded-md bg-[#1a1a2e] border border-pink-400/40" required />
    <button type="submit" class="w-full py-3 bg-gradient-to-r from-[#ff1493] to-[#8b008b] rounded-md font-semibold hover:opacity-90 transition"data-i18n="set-password.saved"></button>
    <p id="setPwdMsg" class="text-sm mt-3 text-center"></p>
  </form>
</section>
