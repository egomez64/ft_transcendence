<section class="max-w-lg mx-auto mt-20 bg-gradient-to-br from-[#581c87b3] via-[#be185d99] to-[#581c87b3] p-12 rounded-2xl shadow-2xl text-pink-100 space-y-8">
    <h2 class="text-3xl font-extrabold text-center text-transparent bg-clip-text bg-gradient-to-r from-[#ff4500] via-[#ff1493] to-[#4b0082]"
        data-i18n="twofa.title">Vérification en deux étapes</h2>
  
    <p class="text-center opacity-90" data-i18n="twofa.subtitle">
      Saisis le code à 6 chiffres envoyé à ton e-mail.
    </p>
  
    <form id="twofaForm" class="flex flex-col space-y-6">
      <input id="twofaCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9]{6}" minlength="6" maxlength="6" required
             class="bg-[#1a1a2eb3] border border-[#f472b6]/40 p-6 rounded-md text-pink-100 placeholder-pink-300 focus:outline-none focus:ring-2 focus:ring-pink-400"
             data-i18n="twofa.code_placeholder" placeholder="Code à 6 chiffres" />
  
      <div class="flex gap-3 justify-end">
        <button id="twofaBackBtn" type="button"
                class="py-3 px-6 rounded-full font-bold bg-slate-600 hover:bg-slate-700 text-white transition"
                data-i18n="twofa.actions.back">Retour</button>
  
        <button id="twofaResendBtn" type="button"
                class="py-3 px-6 rounded-full font-bold bg-purple-600 hover:bg-purple-700 text-white transition"
                data-i18n="twofa.actions.resend">Renvoyer le code</button>
  
        <button type="submit"
                class="py-3 px-6 rounded-full font-bold bg-gradient-to-r from-[#ff1493] to-[#8b008b] text-white hover:opacity-90 transition"
                data-i18n="twofa.actions.verify">Vérifier</button>
      </div>
  
      <p id="twofaMsg" class="text-sm text-center text-pink-200"></p>
    </form>
</section>
