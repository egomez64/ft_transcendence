# ===== Upstreams nommés =====
upstream app_backend {
  server backend:3000;
  keepalive 32;
}

upstream app_frontend {
  server frontend:5173;
  keepalive 32;
}

server {
  listen 443 ssl;
  http2 on;
  server_name localhost;

  # Certificats (montés par docker-compose)
  ssl_certificate     /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;

  # TLS de dev
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # ====== VITE (client + modules + HMR) ======
  location /@vite {
    proxy_pass http://app_frontend;           # pas de slash -> conserve /@vite
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
  }

  location /@react-refresh {
    proxy_pass http://app_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
  }

  location /@id/ {
    proxy_pass http://app_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
  }

  location /src/ {
    proxy_pass http://app_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
  }

  location /node_modules/ {
    proxy_pass http://app_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
  }

  # WebSocket HMR
  location /vite-hmr {
    proxy_pass http://app_frontend/vite-hmr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
  }

  # ====== BACKEND API ======
  location /api/ {
    # IMPORTANT : pas de slash à la fin -> conserve le prefixe /api/
    proxy_pass http://app_backend;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Upgrade (si WS sur /api ou /ws)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 3600;
    proxy_redirect off;
  }

  # ====== WebSocket Pong (Socket.IO) ======
  # IMPORTANT: bloc dédié /ws avec Upgrade/Connection
  location /ws {
    proxy_pass http://app_backend;      # pas de / final → garde l’URI /ws?EIO=4...
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
  }

  # ====== Catch-all vers Vite ======
  location / {
    proxy_pass http://app_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
  }
  # upload avatar
  location /uploads/ {
    proxy_pass http://backend:3000/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Redirection HTTP -> HTTPS
server {
  listen 80;
  server_name localhost;
  return 301 https://$host:8443$request_uri;
}
